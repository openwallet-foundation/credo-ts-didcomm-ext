name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      package:
        description: 'Path of the package to publish, for example packages/calls. Use this when a push run created the GitHub release but did not publish the package.'
        required: true
        type: string

# Queue release runs instead of cancelling them. A cancelled run can create the GitHub release
# and then stop before the publish job runs. The next run then sees no new release and skips the publish.
concurrency:
  group: credo-ts-didcomm-${{ github.ref }}-${{ github.repository }}-release
  cancel-in-progress: false

permissions:
  id-token: write # required for npm trusted publishing
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release-please.outputs.releases_created }}
      paths_released: ${{ steps.release-please.outputs.paths_released }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release-please
        with:
          path: ./packages
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Print release outputs for debugging
        continue-on-error: true
        env:
          RELEASE_OUTPUTS: ${{ toJson(steps.release-please.outputs) }}
        run: |
          echo "Release outputs:"
          echo "$RELEASE_OUTPUTS"

  # Decide which packages to publish: the packages that release-please released on a push,
  # or the package given as input on a manual run.
  plan:
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    needs: [release-please]
    outputs:
      packages: ${{ steps.plan.outputs.packages }}
    steps:
      - name: Select packages to publish
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PACKAGE: ${{ inputs.package }}
          PATHS_RELEASED: ${{ needs.release-please.outputs.paths_released }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            packages="[\"$INPUT_PACKAGE\"]"
          else
            packages="${PATHS_RELEASED:-[]}"
          fi
          echo "packages: $packages"
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  release-package:
    permissions:
      id-token: write # required for npm trusted publishing
      contents: read
    if: ${{ !cancelled() && needs.plan.outputs.packages != '[]' }}
    runs-on: ubuntu-latest
    needs: [plan]
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.plan.outputs.packages) }}
    steps:
      - name: Checkout credo-ts-didcomm-ext
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup node v22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Corepack pnpm
        # OIDC publishing requires a very up to date npm version
        run: |
          npm install -g npm@latest
          corepack enable

      # Ignore scripts so we don't need libindy setup
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Release to NPM
        run: pnpm publish ./${{ matrix.package }} --access public --provenance
