name: Release

on:
  push:
    branches: [main]

concurrency:
  group: credo-ts-didcomm-${{ github.ref }}-${{ github.repository }}-release
  cancel-in-progress: false

permissions:
  id-token: write # required for npm trusted publishing
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout credo-ts-didcomm-ext
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup node v22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Update npm
        # OIDC publishing requires a very up to date npm version
        run: npm install -g npm@latest

      # Ignore scripts so we don't need libindy setup
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Create release pull request or publish to npm
        uses: changesets/action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-title: 'chore(release): new version'
          commit-message: 'chore(release): new version'
          version-script: pnpm changeset-version
          publish-script: pnpm release
          push-with-git-cli: true
